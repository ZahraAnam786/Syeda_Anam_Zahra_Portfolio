<!DOCTYPE html>
<html lang="en">

<!-- Template for every project added from admin.html. It reads ?id=... and draws the project from data/projects.json. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project | Syeda Anam Zahra</title>
    <meta name="description" content="A project by Syeda Anam Zahra.">
    <meta name="theme-color" content="#5B3FD6">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235B3FD6'/%3E%3Ctext x='32' y='43' font-size='30' font-weight='800' text-anchor='middle' fill='white' font-family='Arial,sans-serif'%3ESA%3C/text%3E%3C/svg%3E">
    <script>document.documentElement.classList.add('js');setTimeout(function(){if(!window.__ready)document.documentElement.classList.remove('js')},3500);try{var t=localStorage.getItem('selected-theme');if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="preload" href="assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="header" id="header">
        <nav class="nav container" aria-label="Main">
            <a href="index.html#portfolio" class="nav_logo"><i class="uil uil-arrow-left"></i>Back to portfolio</a>
            <div class="nav_menu" id="nav-menu">
                <ul class="nav_list"></ul>
            </div>
            <div class="nav_btns">
                <button class="icon-btn" id="theme-button" type="button" aria-label="Switch to dark theme"><i class="uil uil-moon"></i></button>
                <button class="icon-btn nav_toggle" id="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-menu"><i class="uil uil-apps"></i></button>
            </div>
        </nav>
        <div class="progress" aria-hidden="true"></div>
    </header>

    <main id="main">
        <div id="project-root"></div>
    </main>

    <!-- drawn by site.js from data/site.json -->
    <footer class="footer" id="site-footer"></footer>

    <a href="#" class="scrollup" id="scroll-up" aria-label="Back to top"><i class="uil uil-arrow-up"></i></a>

    <!-- main.js is added by projects.js after the page is drawn -->
    <script src="assets/js/projects.js"></script>
    <script src="assets/js/site.js"></script>
</body>

</html>
